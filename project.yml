name: MetaMod
options:
  bundleIdPrefix: com.priyanshu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DesignSystem:
    path: Packages/DesignSystem
  AIProviders:
    path: Packages/AIProviders
  GlassesKit:
    path: Packages/GlassesKit
  AgentGateway:
    path: Packages/AgentGateway
  RealtimeVoice:
    path: Packages/RealtimeVoice
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.5.0
  HaishinKit:
    url: https://github.com/Turbo1123/HaishinKit.swift
    branch: fix-concurrency

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    # Meta Wearables credentials — fill these in (or override per-config) before
    # connecting to glasses. Empty is fine for the Phase 0 scaffold build.
    META_APP_ID: ""
    CLIENT_TOKEN: ""

targets:
  MetaMod:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priyanshu.metamod
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: DesignSystem
      - package: AIProviders
      - package: GlassesKit
      - package: AgentGateway
      - package: RealtimeVoice
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
